<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Page</title>
  <link rel="stylesheet" href="./bootstrap-5.3.6-dist/css/bootstrap.css" />
  <link rel="stylesheet" href="./styles/form.css" />
  <script defer src="./scripts/local.js"></script>
</head>
<body>
  <section class="container">
    <h1>Register Candidate</h1>
    <form class="p-5 row" id="formdata">
      <div class="mb-5 col-lg-4">
        <label for="fname">First Name</label>
        <input type="text" name="fname" id="fname" class="form-control" required />
      </div>

      <div class="mb-5 col-lg-4">
        <label for="lname">Last Name</label>
        <input type="text" name="lname" id="lname" class="form-control" required />
      </div>

      <div class="mb-5 col-lg-4">
        <label for="dob">Date of Birth</label>
        <input type="date" name="dob" id="dob" class="form-control" required />
      </div>

      <div class="mb-5 col-lg-4">
        <label for="age">Age</label>
        <input type="number" name="age" id="age" class="form-control" required />
      </div>

      <div class="mb-5 col-lg-4">
        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" class="form-control" required />
      </div>

      <div class="col-lg-4">
        <label for="position">Position</label>
        <select name="position" id="position" class="form-select" required>
          <option value="">Select Position</option>
          <option value="Frontend developer">Frontend developer</option>
          <option value="Backend developer">Backend developer</option>
          <option value="Azure">Azure</option>
          <option value="DevOps">DevOps</option>
        </select>
      </div>

      <div class="form-group col-lg-4 mt-5">
        <label class="mb-2">Gender</label><br />
        <input type="radio" name="gender" class="form-check-input me-2" id="male" value="male" required />
        <label for="male">Male</label>
        <input type="radio" name="gender" class="form-check-input ms-3 me-2" id="female" value="female" required />
        <label for="female">Female</label>
      </div>

      <div class="col-lg-4 mt-5">
        <label class="mb-2">Languages</label><br />
        <input type="checkbox" name="lang" class="me-2" id="csharp" value="C#" />
        <label for="csharp">C#</label>
        <input type="checkbox" name="lang" class="ms-3 me-2" id="java" value="Java" />
        <label for="java">Java</label>
        <input type="checkbox" name="lang" class="ms-3 me-2" id="rust" value="Rust" />
        <label for="rust">Rust</label>
      </div>

      <div class="col-4 mt-5">
        <label for="url">GitHub Profile</label>
        <input type="url" name="url" id="url" class="form-control" required />
      </div>

      <input type="hidden" name="index" id="index" />

      <div class="row mt-5">
        <div class="col-md-3 col-lg-2">
          <input type="submit" class="form-control btn btn-success" id="submit" value="Submit" />
        </div>
      </div>
    </form>
  </section>

  <section class="container-lg" id="test" style="display: none;">
    <table class="table table-striped table-hover">
      <legend class="text-center mt-3 mb-3">Candidate Details</legend>
      <thead class="table-primary">
        <tr>
          <th>FirstName</th>
          <th>LastName</th>
          <th>DOB</th>
          <th>Age</th>
          <th>E-mail</th>
          <th>Position</th>
          <th>Gender</th>
          <th>Language</th>
          <th>GitHub Profile</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tb"></tbody>
    </table>
  </section>
</body>
</html>
